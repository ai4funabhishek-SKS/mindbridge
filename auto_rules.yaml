# mindbridge Auto-Ingestion Rules Configuration
# Configure folder watching, classification rules, and enrichment options
# This file is watched for changes - no restart needed for rule updates

# ============================================================================
# WATCH FOLDERS
# ============================================================================
# Folders to monitor for new files
# Use ~ for home directory, relative paths are from project root

watch_folders:
  - path: "~/Desktop"
    recursive: true
    include_patterns: ["*"]
    exclude_patterns:
      - "*.tmp"
      - "*.temp"
      - "*.log"
      - "~$*"
      - ".~lock*"
      - "Thumbs.db"
      - "Desktop.ini"
  
  - path: "~/Downloads"
    recursive: true
    include_patterns: ["*"]
    exclude_patterns:
      - "*.tmp"
      - "*.temp"
      - "*.crdownload"
      - "*.partial"
      - "*.log"
      - "~$*"
      - ".~lock*"
  
  - path: "~/Documents/Inbox"
    recursive: true
    include_patterns: ["*"]
    exclude_patterns:
      - "*.tmp"
      - "*.temp"
      - "*.log"
      - "~$*"
      - ".~lock*"
  
  - path: "Raw_copies/incoming"
    recursive: true
    include_patterns: ["*"]
    exclude_patterns:
      - "*.tmp"
      - "*.temp"
      - "*.log"
      - "~$*"
      - ".~lock*"

# ============================================================================
# CLASSIFICATION RULES
# ============================================================================
# Rules are evaluated in order - first match wins
# action: vault, cold_storage, domain_name, or skip

classification_rules:
  # Security - Secrets and credentials (HIGHEST PRIORITY)
  - name: "secrets_and_keys"
    priority: 10
    patterns:
      - "*key*.txt"
      - "*.env"
      - "*.env.*"
      - "*secret*"
      - "*credential*"
      - "*.key"
      - "*api*key*"
      - "*access*token*"
      - "*private*key*"
    action: "vault"
    description: "API keys, secrets, credentials - send to vault"

  # Personal Identifiable Information
  - name: "personal_pii"
    priority: 20
    patterns:
      - "*cv*"
      - "*resume*"
      - "*passport*"
      - "*aadhar*"
      - "*pan*card*"
      - "*bank*statement*"
      - "*account*statement*"
      - "*tax*return*"
      - "*salary*slip*"
      - "*pay*slip*"
    action: "vault"
    description: "Personal documents - send to vault"

  # Temporary and system files
  - name: "temp_and_system"
    priority: 30
    patterns:
      - "*.tmp"
      - "*.temp"
      - "*.log"
      - "*.bak"
      - "*.bak*"
      - "*.old"
      - "*.swp"
      - "*.swo"
      - "~$*"
      - ".~lock*"
      - "Thumbs.db"
      - "Desktop.ini"
      - "*.crdownload"
      - "*.partial"
      - "*.part"
      - "*.swp"
      - "*.swo"
      - "*.lock"
      - "*.pid"
    action: "cold_storage"
    description: "Temporary and system files - cold storage"

  # Vendor boilerplate and generic files
  - name: "vendor_boilerplate"
    priority: 40
    patterns:
      - "README*"
      - "LICENSE*"
      - "CHANGELOG*"
      - "CONTRIBUTING*"
      - "CODE_OF_CONDUCT*"
      - "CODEOWNERS*"
      - "SECURITY*"
      - "welcome*"
      - "Welcome*"
      - "000_home*"
      - "INSTALL*"
      - "INSTALLATION*"
      - "GETTING_STARTED*"
      - "QUICKSTART*"
    action: "cold_storage"
    description: "Generic boilerplate files - cold storage"

  # Duplicate files
  - name: "duplicates"
    priority: 50
    patterns:
      - "dup_*"
      - "*_dup*"
      - "*(1).*"
      - "*(2).*"
      - "*(3).*"
      - "*copy*"
      - "*Copy*"
      - "*COPY*"
    action: "cold_storage"
    description: "Duplicate files - cold storage"

  # Development and build artifacts
  - name: "build_artifacts"
    priority: 50
    patterns:
      - "*.pyc"
      - "*.pyo"
      - "__pycache__"
      - "*.egg-info"
      - "dist/"
      - "build/"
      - "*.egg"
      - "node_modules/"
      - ".venv/"
      - "venv/"
      - "env/"
      - ".env"
      - ".env.*"
      - "*.egg"
      - "*.whl"
      - "*.tar.gz"
      - "*.zip"
      - "*.rar"
      - "*.7z"
      - "*.exe"
      - "*.dll"
      - "*.so"
      - "*.dylib"
    action: "cold_storage"
    description: "Build artifacts and dependencies - cold storage"

  # IDE and editor files
  - name: "ide_files"
    priority: 50
    patterns:
      - ".vscode/"
      - ".idea/"
      - "*.swp"
      - "*.swo"
      - "*.sublime-*"
      - "*.code-workspace"
      - ".project"
      - ".classpath"
      - ".settings/"
      - "*.sln"
      - "*.csproj"
      - "*.vcxproj"
      - "*.user"
      - "*.suo"
    action: "cold_storage"
    description: "IDE configuration files - cold storage"

  # Operating system files
  - name: "os_files"
    priority: 50
    patterns:
      - "Thumbs.db"
      - "Desktop.ini"
      - ".DS_Store"
      - "._*"
      - ".Spotlight-V100"
      - ".Trashes"
      - "ehthumbs.db"
      - "ehthumbs_vista.db"
    action: "cold_storage"
    description: "OS metadata files - cold storage"

  # Knowledge domains - AI & Automation
  - name: "ai_automation"
    priority: 60
    patterns:
      - "*agent*"
      - "*ai*prompt*"
      - "*llm*"
      - "*langchain*"
