# ============================================================================
# ENRICHMENT OPTIONS
# ============================================================================

enrichment:
  # Extract named entities (people, orgs, locations, etc.)
  extract_entities: true
  
  # Generate AI summary of content
  generate_summary: true
  
  # Suggest relevant tags
  suggest_tags: true
  
  # Find related documents in knowledge base
  find_related: true
  
  # Extract action items and todos
  extract_actions: true
  
  # Detect language
  detect_language: true
  
  # Generate embeddings for semantic search
  generate_embeddings: true

# ============================================================================
# POST-INGESTION ACTIONS
# ============================================================================

post_ingestion:
  # Rebuild search index after ingestion
  rebuild_search_index: true
  
  # Rebuild folder indexes
  rebuild_folder_indexes: true
  
  # Regenerate dashboards
  regenerate_dashboards: true
  
  # Run test suite
  run_tests: true
  
  # Send email report
  send_email_report: true
  email_recipient: "Aiadoptionconsultant@gmail.com"

# ============================================================================
# PERFORMANCE SETTINGS
# ============================================================================

performance:
  # Maximum concurrent file processing
  max_concurrent_files: 4
  
  # Batch size for embedding generation
  embedding_batch_size: 32
  
  # Maximum file size to process (MB)
  max_file_size_mb: 100
  
  # Timeout for LLM classification (seconds)
  classification_timeout: 30
  
  # Maximum retries for failed operations
  max_retries: 3
  
  # Retry delay (seconds)
  retry_delay: 5