# mindbridge LLM Provider Configuration
# Supports multiple providers with fallback chain
# Copy to mindbridge_config.yaml and customize

llm_providers:
  # OpenCode Zen (free, cloud) - default primary
  opencode:
    enabled: true
    priority: 1
    provider_type: "opencode"
    model: "freemodel"
    # No API key needed for OpenCode Zen
    base_url: null
    timeout: 60
    max_tokens: 4096
    temperature: 0.2

  # Groq (free tier, cloud) - secondary
  groq:
    enabled: true
    priority: 2
    provider_type: "groq"
    model: "openai/gpt-oss-120b"  # or llama-3.1-8b-instant for speed
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    timeout: 60
    max_tokens: 4096
    temperature: 0.2

  # Ollama (local) - tertiary fallback
  ollama:
    enabled: true
    priority: 3
    provider_type: "ollama"
    model: "llama3.2"
    base_url: "http://localhost:11434"
    timeout: 120
    max_tokens: 4096
    temperature: 0.2
    # Fallback models if primary fails
    fallback_models:
      - "phi3:mini"
      - "qwen2.5:7b-instruct"

  # OpenAI-compatible (custom endpoints)
  openai_compatible:
    enabled: false
    priority: 4
    provider_type: "openai_compatible"
    model: "gpt-3.5-turbo"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    timeout: 60
    max_tokens: 4096
    temperature: 0.2

# Fallback chain order (by priority)
fallback_chain: ["opencode", "groq", "ollama"]

# Embedding configuration (always local via Ollama)
embeddings:
  provider: "ollama"
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"
  dimensions: 768
  batch_size: 32

# Ask mode settings
ask_mode:
  default_provider: "auto"  # Uses fallback_chain
  max_passages: 12
  max_passage_chars: 700
  context_window: 4096
  temperature: 0.2
  fallback_context_windows: [4096, 2048, 1024]
  citation_format: "[S{num}]"
  save_briefings: true
  briefings_dir: "Briefings"