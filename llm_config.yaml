# mindbridge LLM Provider Configuration
# Supports multiple providers with fallback chain
# Copy to mindbridge_config.yaml and customize

llm_providers:
  # OpenCode Zen - NOT callable as external API (lives inside opencode CLI only).
  # Kept for documentation; disable to avoid wasted fallback attempts.
  opencode:
    enabled: false
    priority: 1
    provider_type: "opencode"
    model: "freemodel"
    base_url: null
    timeout: 60
    max_tokens: 4096
    temperature: 0.2

  # Groq (free tier, cloud) - PRIMARY brain
  groq:
    enabled: true
    priority: 2
    provider_type: "groq"
    model: "openai/gpt-oss-120b"  # reasoning model; keep max_tokens >= 512
    api_key_env: "GROQ_API_KEY"
    base_url: "https://api.groq.com/openai/v1"
    timeout: 60
    max_tokens: 4096
    temperature: 0.2

  # Ollama (local) - offline/privacy fallback (RAM-aware ctx ladder built-in)
  ollama:
    enabled: true
    priority: 3
    provider_type: "ollama"
    model: "llama3.2"
    base_url: "http://localhost:11434"
    timeout: 120
    max_tokens: 4096
    temperature: 0.2
    fallback_models:
      - "phi3:mini"
      - "qwen2:7b-instruct"

# Fallback chain order (by priority)
fallback_chain: ["groq", "ollama"]

# Embedding configuration (always local via Ollama)
embeddings:
  provider: "ollama"
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"
  dimensions: 768
  batch_size: 32

# Ask mode settings
ask_mode:
  default_provider: "auto"  # Uses fallback_chain
  max_passages: 12
  max_passage_chars: 700
  context_window: 4096
  temperature: 0.2
  fallback_context_windows: [4096, 2048, 1024]
  citation_format: "[S{num}]"
  save_briefings: true
  briefings_dir: "Briefings"